name: M0 follow-up source verification
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/research_m0_followup.py'
      - '.github/workflows/m0-followup-research.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4 pillow
      - run: python tools/research_m0_followup.py
      - uses: actions/upload-artifact@v4
        with:
          name: m0-followup-research
          path: m0-followup-research/
          retention-days: 1
          if-no-files-found: error
