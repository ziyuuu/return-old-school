name: Prepare pinned M1.0 toolchain
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/m10-toolchain.yml'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned open-source dependencies
        run: |
          mkdir -p /tmp/m10-deps
          cd /tmp/m10-deps
          npm init -y
          npm install --save-exact three@0.180.0 vite@6.1.0 typescript@5.7.3 @types/three@0.180.0 @dimforge/rapier3d-compat@0.17.3
          tar -czf "$GITHUB_WORKSPACE/m10-toolchain.tar.gz" node_modules package.json package-lock.json
          cd "$GITHUB_WORKSPACE"
          sha256sum m10-toolchain.tar.gz > m10-toolchain.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: m10-toolchain
          path: |
            m10-toolchain.tar.gz
            m10-toolchain.sha256
          retention-days: 3
          if-no-files-found: error
