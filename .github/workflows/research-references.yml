name: Collect restoration reference evidence
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research-references.yml'
      - 'tools/collect_restoration_references.py'
permissions:
  contents: read
jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reference inspection tools
        run: python -m pip install requests beautifulsoup4 pillow
      - name: Collect allowlisted research references and provenance
        run: python tools/collect_restoration_references.py
      - uses: actions/upload-artifact@v4
        with:
          name: restoration-reference-research
          path: research-download/
          retention-days: 1
          if-no-files-found: error
