name: Build and verify M1.1-A terrain
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/campus/**'
      - 'data/m11a/**'
      - 'tools/m11a/**'
      - 'tests/m11a/**'
      - '.github/workflows/m11a-build.yml'
permissions:
  contents: write
concurrency:
  group: m11a-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert frozen R4 and integrate independent vertical layer
        run: python tools/m11a/apply-stage.py
      - name: Locked runtime and frozen/new regressions
        run: |
          set -o pipefail
          mkdir -p qa/m11a
          cd apps/campus
          npm ci
          node --test ../../tests/m10/*.test.mjs ../../tests/m11a/*.test.mjs | tee ../../qa/m11a/unit-tests.txt
          npm run build | tee ../../qa/m11a/build.txt
          cd ../..
          node tools/m11a/build-standalone.mjs
          node tools/m11a/export.mjs
      - name: Install actual browser without unrelated apt index refresh
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install chromium
          sudo apt-get -o Acquire::Retries=3 install -y fonts-noto-cjk
      - name: Verify real ground, roads, steps and all toilet floors
        run: python tools/m11a/capture.py
      - name: Package verified terrain and study documents
        run: python tools/m11a/package.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Yali-M1.1-A-review
          path: |
            artifacts/m11a/
            qa/m11a/
          retention-days: 60
          if-no-files-found: error
      - name: Commit verified current source and generated terrain evidence
        if: success()
        run: |
          git config user.name 'return-old-school validation bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/campus/src/main.ts apps/campus/src/style.css apps/campus/src/terrain-scene.ts apps/campus/index.html data/m11a docs/m11a qa/m11a
          git diff --cached --quiet || git commit -m 'build: retain verified M1.1-A terrain, source integration and actual WebGL evidence'
          git push origin HEAD:main
