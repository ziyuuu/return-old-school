name: Build and verify M1.1-A Patch02
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: m11a-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse archival replay over Batch01
        run: test ! -f apps/campus/src/batch01-core.mjs
      - name: Materialize auditable source once and verify frozen baseline
        run: python tools/m11a/patch02/materialize.py
      - name: Build pinned runtime and run old/new regressions
        run: |
          set -o pipefail
          mkdir -p qa/m11a-p02
          cd apps/campus
          npm ci
          node --test ../../tests/m10/*.test.mjs ../../tests/m11a/*.test.mjs ../../tests/m11a/patch02/*.test.mjs | tee ../../qa/m11a-p02/unit-tests.txt
          npm run build | tee ../../qa/m11a-p02/build.txt
          cd ../..
          node tools/m11a/build-standalone.mjs
          node tools/m11a/patch02/export.mjs
      - name: Install real browser and CJK rendering support
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install chromium
          sudo apt-get -o Acquire::Retries=3 install -y fonts-noto-cjk
      - name: Check actual uphill surface, loop, gym doorway and spectator stairs
        run: python tools/m11a/patch02/capture.py
      - name: Package tested HTML, same-data plans and review
        run: python tools/m11a/patch02/package.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Yali-M1.1-A-Patch02
          path: |
            artifacts/m11a-p02/
            qa/m11a-p02/
          retention-days: 60
          if-no-files-found: error
      - name: Commit only verified readable source, data and browser evidence
        if: success()
        run: |
          git config user.name 'return-old-school validation bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/campus/src apps/campus/index.html data/m11a/patch02 tools/m11a/patch02 tests/m11a/patch02 docs/m11a/patch02 qa/m11a-p02
          git diff --cached --quiet || git commit -m 'fix: retain verified Patch02 slope, gym frontage, spectator staircase and loop evidence'
          git push origin HEAD:main
