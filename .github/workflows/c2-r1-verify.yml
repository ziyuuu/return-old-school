name: C2 R1 student avatar verify
on:
  push:
    branches: [codex/c2-student-avatar]
    paths: [.github/workflows/c2-r1-verify.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/c2-student-avatar
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Wire, build, test and export
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/campus/src/player/player-mode.ts');s=p.read_text()
          s=s.replace("import {createScaleAvatar} from './scale-avatar';","import {createStudentAvatar} from './student-avatar';")
          s=s.replace('avatar=createScaleAvatar(host.mats)','avatar=createStudentAvatar(host.mats)')
          s=s.replace('C1 · 可控漫游 / 比例人形','C2 · 学生漫游 / 2006–2010工作重建')
          s=s.replace('当前为比例人形，不代表历史校服。C1 验证移动与代表性入口；C2 制作学生形象，C3 再做全校园连续走测。','当前学生形象依据08/09届校友资料做证据有界工作重建：偏大尺码秋季校服轮廓可信，精确剪裁/配色比例/发型为H；不虚构校徽或个人身份。C3再做全校园连续走测。')
          s=s.replace("avatar:{visible:avatar.root.visible,finalStudent:false,footPosition:avatar.root.position.toArray()}","avatar:{visible:avatar.root.visible,footPosition:avatar.root.position.toArray(),...avatar.state()}")
          p.write_text(s)
          PY
          npm ci --prefix apps/campus
          npm run build --prefix apps/campus
          mkdir -p qa/m11c-c2/build
          node --test tests/m11c/c1/*.test.mjs tests/m11c/c2/*.test.mjs tests/render-upgrade/*.test.mjs | tee qa/m11c-c2/build/tests.tap
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/campus/src/player/player-mode.ts qa/m11c-c2/build
          if ! git diff --cached --quiet; then git commit -m 'feat(c2): activate student avatar in inherited C1.2 runtime [skip ci]'; git push origin HEAD:codex/c2-student-avatar; fi
          node tools/m11c-c2/export.mjs
          git add artifacts/m11c-c2
          git commit -m 'build(c2): export C2 R1 offline Viewer [skip ci]'
          git push origin HEAD:codex/c2-student-avatar
      - name: Install Chromium and capture
        run: |
          npm install --prefix "$RUNNER_TEMP/c2-browser" --save-exact playwright@1.62.0
          "$RUNNER_TEMP/c2-browser/node_modules/.bin/playwright" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/c2-browser/node_modules/playwright" node tools/m11c-c2/capture.mjs
      - name: Publish delivery
        run: |
          python - <<'PY'
          import json,pathlib
          r=pathlib.Path('.')
          q=json.loads((r/'qa/m11c-c2/browser/report.json').read_text());m=json.loads((r/'artifacts/m11c-c2/viewer-manifest.json').read_text());assert q['passed'] and q['viewerSHA256']==m['sha256']
          (r/'docs/m11c/c2/delivery.md').write_text(f'''# C2 R1｜学生形象与基础动画交付\n\n**IMPLEMENTED / REVIEW_PENDING**。继承C1 R1.2手机优化和全部已认可校园模型；不登记acceptance、不合并main。\n\nViewer：`artifacts/m11c-c2/Yali_C2_R1_Viewer.html`，SHA256 `{m['sha256']}`。\n\n实现：证据有界的偏大尺码秋季校服学生工作重建；idle / walk / run / air 四态；第三/第一人称、坡速、碰撞、相机与手机流畅档沿用C1 R1.2。无校徽、班级、个人脸或外部人物纹理。\n\n浏览器QA：{len(q['checks'])}项检查、{len(q['screenshots'])}张实际截图通过。精确剪裁、色值、发型和体型仍为H；C3尚未开始。\n''')
          (r/'qa/m11c-c2/README.md').write_text(f'''# C2 R1 QA\n\nViewer SHA256 `{m['sha256']}`。节点测试见 `build/tests.tap`；实际 Chromium 报告见 `browser/report.json`。C2只替换可见学生形象和动画，不改变C1胶囊、道路、建筑或手机性能策略。\n''')
          PY
          git add docs/m11c/c2 qa/m11c-c2
          git commit -m 'qa(c2): publish actual student-avatar browser review [skip ci]'
          git push origin HEAD:codex/c2-student-avatar
          git ls-remote origin refs/heads/codex/c2-student-avatar refs/heads/codex/c1-player-controller refs/heads/main
      - uses: actions/upload-artifact@v4
        with:
          name: C2-R1-review
          path: |
            artifacts/m11c-c2
            qa/m11c-c2
            docs/m11c/c2
          retention-days: 30
