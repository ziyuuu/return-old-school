name: B02 gym and music targeted verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m11b-b02.yml'
      - 'apps/campus/src/batch02*'
      - 'data/m11b/batch02/**'
      - 'tools/m11b-b02/**'
permissions:
  contents: write
concurrency:
  group: yali-b02-main
  cancel-in-progress: false
jobs:
  b02:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/campus/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply the focused corrections identified in the first actual screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if grep -q '"top": 18.0, "v": 0.55' data/m11b/batch02/input.json; then
            gh api repos/ziyuuu/return-old-school/git/blobs/3f8a519bb314ffaa13d0bbd53147e1c9480c8a8a --jq .content | base64 -d > /tmp/b02-correction.patch
            test "$(git hash-object /tmp/b02-correction.patch)" = 3f8a519bb314ffaa13d0bbd53147e1c9480c8a8a
            git apply --check /tmp/b02-correction.patch
            git apply /tmp/b02-correction.patch
          fi
      - name: Normal typecheck/build and eight targeted geometric groups
        run: |
          set -euo pipefail
          mkdir -p qa/m11b-b02
          npm ci --prefix apps/campus
          npm run build --prefix apps/campus | tee qa/m11b-b02/build.txt
          node tools/m11b-b02/check.mjs
          node tools/m11b-b02/export.mjs
          git diff --exit-code 471f6bdd3eb234b10bf26c0e8874a88d708dc7a6 -- data/m10 data/m11b/batch01 data/m11b/batch01-r2 data/m11b/batch01-r3 apps/campus/src/b01-shutter-fix.mjs
      - name: Commit the actual integrated source before measuring its browser result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/campus/src/main.ts apps/campus/src/style.css apps/campus/src/batch02-core.mjs data/m11b/batch02 tools/m11b-b02 README.md docs/development-plan.md .gitignore docs/m11b/batch02
          if ! git diff --cached --quiet; then
            git commit -m 'fix(b02): recess the five-ring panel after photo comparison; sample real loop grades and preserve forecourt (#31)'
            git push origin HEAD:main
          fi
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Set up real Chromium and CJK screenshot rendering
        run: |
          pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Real full-scene route clearance, desktop/mobile screenshots, and offline single-file loading
        run: python tools/m11b-b02/capture.py
      - name: Archive actual QA, then package only the hash-matched tested file
        run: |
          set -euo pipefail
          python tools/m11b-b02/package.py --prepare
          git add qa/m11b-b02 docs/m11b/batch02
          if ! git diff --cached --quiet; then
            git commit -m 'qa(b02): archive actual WebGL screenshots and entry/route checks; alumni review pending (#31)'
            git push origin HEAD:main
          fi
          export DELIVERY_SHA=$(git rev-parse HEAD)
          python - <<'PY'
          import json,os,pathlib
          a=pathlib.Path('artifacts/m11b-b02')
          b=json.loads(pathlib.Path('qa/m11b-b02/browser-report.json').read_text())
          (a/'delivery-receipt.json').write_text(json.dumps({'source_sha':b['source_sha'],'delivery_sha':os.environ['DELIVERY_SHA'],'viewer_sha256':b['viewer_sha256'],'status':'IMPLEMENTED / REVIEW_PENDING'},indent=2))
          PY
          python tools/m11b-b02/package.py
      - name: Retain the exact current source even when a targeted check finds an issue
        if: always()
        run: |
          mkdir -p artifacts/m11b-b02
          git archive --format=tar.gz HEAD > artifacts/m11b-b02/current-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Yali-M1-1-B-B02-Viewer-Review-Workspace
          path: |
            artifacts/m11b-b02/
            qa/m11b-b02/
          retention-days: 30
