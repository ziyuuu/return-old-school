name: Build and verify M1.1-B Batch01
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m11b-b01-build.yml'
      - 'apps/campus/**'
      - 'data/m11b/**'
      - 'data/m11a/patch03/**'
      - 'data/m11a/patch04/**'
      - 'tools/m11b/**'
      - 'tests/m11b/**'
permissions:
  contents: write
concurrency:
  group: m11b-b01-main
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned build and complete regression suite on readable source
        run: |
          set -o pipefail
          mkdir -p qa/m11b-b01
          echo "$SOURCE_SHA" > qa/m11b-b01/source-commit.txt
          npm ci --prefix apps/campus
          node --test tests/m10/*.test.mjs tests/m11a/*.test.mjs tests/m11a/patch02/*.test.mjs tests/m11b/*.test.mjs | tee qa/m11b-b01/unit-tests.txt
          npm run build --prefix apps/campus | tee qa/m11b-b01/build.txt
          node tools/m11b/export.mjs
          git diff --exit-code -- data/m10
      - name: Install Chromium and CJK rendering support
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          sudo apt-get -o Acquire::Retries=3 install -y fonts-noto-cjk
      - name: Actual WebGL geometry and desktop/mobile screenshots
        run: python tools/m11b/capture.py
      - name: Package actual screenshot review and reproducible workspace
        if: always()
        run: |
          if test -f qa/m11b-b01/browser-report.json; then python tools/m11b/package.py; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Yali-M1.1-B-Batch01
          path: |
            artifacts/m11b-b01/
            qa/m11b-b01/
          retention-days: 60
          if-no-files-found: error
      - name: Commit verified evidence; alumni review remains pending
        if: success()
        run: |
          git config user.name 'return-old-school validation bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/m11a/patch04/resolved-terrain.json data/m11b docs/m11b
          git add -f qa/m11b-b01
          git diff --cached --quiet || git commit -m 'test: archive actual Batch01 Chromium geometry, screenshots and delivery provenance'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
