name: Build and verify M1.1-B Batch01
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/m11b-b01-build.yml'
      - '.github/b01-resume/**'
      - 'apps/campus/**'
      - 'data/m11b/**'
      - 'tools/m11b/**'
      - 'tests/m11b/**'
permissions:
  contents: write
concurrency:
  group: m11b-b01-main
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover readable source once without modifying frozen M1.0
        run: |
          python tools/m11b/materialize.py
          git diff --exit-code -- data/m10
          git config user.name 'return-old-school validation bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md apps/campus/src apps/campus/index.html data/m11a/patch03 data/m11a/patch04 data/m11b docs tools/m11b tests/m11b
          git diff --cached --quiet || git commit -m 'feat: restore approved P3/P4 base and old teaching block, continuous toilets and four bridges'
          git push origin HEAD:main
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Pinned build and complete regression suite
        run: |
          set -o pipefail
          mkdir -p qa/m11b-b01
          npm ci --prefix apps/campus
          node --test tests/m10/*.test.mjs tests/m11a/*.test.mjs tests/m11a/patch02/*.test.mjs tests/m11b/*.test.mjs | tee qa/m11b-b01/unit-tests.txt
          npm run build --prefix apps/campus | tee qa/m11b-b01/build.txt
          node tools/m11b/export.mjs
      - name: Install Chromium and CJK rendering support
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install chromium
          sudo apt-get -o Acquire::Retries=3 install -y fonts-noto-cjk
      - name: Actual WebGL geometry, offline launch and responsive screenshot verification
        run: python tools/m11b/capture.py
      - name: Package actual screenshot review and reproducible workspace
        run: python tools/m11b/package.py
      - name: Commit actual browser evidence and resolved geometry
        if: success()
        run: |
          git add data/m11a/patch04/resolved-terrain.json data/m11b docs/m11b qa/m11b-b01
          git diff --cached --quiet || git commit -m 'test: record real Batch01 WebGL probes, desktop/mobile screenshots and delivery provenance'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Yali-M1.1-B-Batch01
          path: |
            artifacts/m11b-b01/
            qa/m11b-b01/
          retention-days: 60
          if-no-files-found: error
