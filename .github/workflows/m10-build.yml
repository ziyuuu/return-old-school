name: Recheck frozen M1.0 R4 (manual)
# M1.0 is accepted/frozen. Never apply old R4 migrations to active M1.1 code.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: baseline/m1.0-r4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recheck the accepted source without modifying its branch
        working-directory: apps/campus
        run: |
          npm ci
          npm test
          npm run build
          npm run standalone
      - uses: actions/upload-artifact@v4
        with:
          name: M1.0-R4-frozen-rebuild
          path: artifacts/m10/
          retention-days: 30
