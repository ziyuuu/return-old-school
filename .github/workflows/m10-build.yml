name: Build and verify M1.0 campus
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/campus/**'
      - 'data/m10/layout-input.json'
      - 'tools/m10/**'
      - 'tests/m10/**'
      - '.github/workflows/m10-build.yml'
permissions:
  contents: write
concurrency:
  group: m10-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve the working coordinate baseline
        run: python tools/m10/generate-layout.py
      - name: Install pinned runtime and lock dependencies
        working-directory: apps/campus
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Layout regressions and production build
        run: |
          cd apps/campus
          npm test
          npm run build
          npm run standalone
          cd ../..
          node tools/m10/export-footprints.mjs
      - name: Install browser test runner
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Exercise actual browser and capture scenes
        run: python tools/m10/capture.py
      - name: Create source and offline viewer package
        run: |
          python - <<'PY'
          import pathlib,zipfile,json,hashlib
          root=pathlib.Path('.')
          out=root/'artifacts/m10'
          include=['apps/campus','data','docs/m10','tests/m10','tools/m10','qa/m10']
          with zipfile.ZipFile(out/'Yali_M1_0_Workspace.zip','w',zipfile.ZIP_DEFLATED) as z:
              for folder in include:
                  for p in sorted((root/folder).rglob('*')):
                      if not p.is_file() or 'node_modules' in p.parts or '__pycache__' in p.parts: continue
                      if p.suffix.lower() in ['.ttf','.otf','.woff','.woff2']: continue
                      z.write(p,p.as_posix())
              for p in [out/'Yali_M1_0_Viewer.html',out/'THIRD_PARTY_NOTICES.txt']:
                  z.write(p,p.name)
          files={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for folder in include for p in (root/folder).rglob('*') if p.is_file() and 'node_modules' not in p.parts and '__pycache__' not in p.parts}
          (out/'checksums.json').write_text(json.dumps(files,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Yali-M1.0-review
          path: |
            artifacts/m10/
            qa/m10/
          retention-days: 30
      - name: Commit generated data and verified screenshots
        if: success()
        run: |
          git config user.name 'return-old-school validation bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/campus/package-lock.json data/m10/campus-layout.json data/m10/footprints.json data/m10/footprints.csv qa/m10
          git diff --cached --quiet || git commit -m 'build: record verified M1.0 footprints, browser screenshots and dependency lock'
          git push origin HEAD:main
