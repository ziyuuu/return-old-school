name: Build and verify M1.0 R3 campus
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/campus/**'
      - 'data/m10/layout-input.json'
      - 'tools/m10/**'
      - 'tests/m10/**'
      - '.github/workflows/m10-build.yml'
permissions:
  contents: write
concurrency:
  group: m10-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply auditable R3 once and resolve layout
        run: |
          python tools/m10/repair-r3.py
          python tools/m10/generate-layout.py
          python tools/check_restoration_v07.py
      - name: Build locked runtime and execute regressions
        run: |
          set -o pipefail
          mkdir -p qa/m10-r3
          cd apps/campus
          npm ci
          npm test | tee ../../qa/m10-r3/unit-tests.txt
          npm run build | tee ../../qa/m10-r3/build.txt
          npm run standalone
          cd ../..
          node tools/m10/export-footprints.mjs
      - name: Install actual browser using runner system libraries
        run: |
          python -m pip install playwright==1.62.0
          # Hosted Ubuntu already provides Chromium runtime libraries. Download
          # the pinned browser directly instead of updating unrelated apt repos.
          python -m playwright install chromium
          sudo apt-get -o Acquire::Retries=3 install -y fonts-noto-cjk
      - name: Verify HTTP and file startup, actual meshes and screenshots
        run: python tools/m10/capture-r3.py
      - name: Export same-data plan and package review
        run: python tools/m10/package-r3.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Yali-M1.0-R3-review
          path: |
            artifacts/m10/
            qa/m10-r3/
          retention-days: 30
          if-no-files-found: error
      - name: Commit only successfully tested current source and data
        if: success()
        run: |
          git config user.name 'return-old-school validation bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/campus/src apps/campus/index.html data/m10 data/restoration/facility-register.csv data/restoration/assumption-register-r3.json data/spatial-constraints.json tests/m10/layout.test.mjs tools/m10/export-footprints.mjs README.md docs/development-plan.md docs/plates/masterplan-m10-r3.svg qa/m10-r3
          git diff --cached --quiet || git commit -m 'fix: record verified R3 layout, real geometry, routes, current docs and browser evidence'
          git push origin HEAD:main
