name: B04 verified workspace acquisition
on:
  push:
    branches: [codex/b04-development]
    paths: [.github/workflows/b04-workspace-read.yml]
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clone and verify current main using Git
        run: |
          set -euxo pipefail
          mkdir staging
          git clone https://github.com/ziyuuu/return-old-school.git staging/return-old-school
          cd staging/return-old-school
          git fetch origin
          git switch main
          git pull --ff-only origin main
          git rev-parse HEAD | tee ../base-head.txt
          git status --short | tee ../base-status.txt
          git merge-base --is-ancestor f8ece5fcade5c64332cc7fb34ac707b1d3aad8fc HEAD
          git merge-base --is-ancestor 332b0c30a0371df676bccd798fd4d37ad53cedc4 HEAD
          test -f docs/m11b/batch04/start-next-thread.md
          git switch --track origin/codex/b04-development
          npm ci --prefix apps/campus
          npm run build --prefix apps/campus
          git log -3 --oneline
          git ls-remote origin refs/heads/main refs/heads/codex/b04-development | tee ../remote-refs.txt
      - name: Package public source and locked dependencies (no research originals)
        run: |
          tar -czf b04-current-workspace.tar.gz -C staging .
          sha256sum b04-current-workspace.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: b04-current-verified-workspace
          path: b04-current-workspace.tar.gz
          retention-days: 3
          compression-level: 0
