name: C1 R1.1 direction and slope correction
on:
  push:
    branches: [codex/c1-player-controller]
    paths: [.github/workflows/c1-r11-fix.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      revision: ${{ steps.build.outputs.revision }}
      viewer_sha: ${{ steps.build.outputs.viewer_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/c1-player-controller
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: build
        name: Apply checked R1.1 correction, build, test and publish exact Viewer
        run: |
          set -euo pipefail
          git fetch origin
          git merge-base --is-ancestor origin/main HEAD
          python - <<'PY'
          import base64,lzma,pathlib,hashlib,subprocess
          src=pathlib.Path('.github/c1-r11-fix.patch.xz.b64').read_text().strip()
          patch=lzma.decompress(base64.b64decode(src))
          assert hashlib.sha256(patch).hexdigest()=='8934aea38e3bb854abbd3b31fdae1dd65c186dde9508ce726ed056daa98d8230'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          PY
          npm ci --prefix apps/campus
          mkdir -p qa/m11c-c1/r1.1/build
          git diff --check
          npm run build --prefix apps/campus 2>&1 | tee qa/m11c-c1/r1.1/build/build.log
          node --test tests/m11c/c1/controller.test.mjs tests/render-upgrade/*.test.mjs 2>&1 | tee qa/m11c-c1/r1.1/build/tests.tap
          node --check tools/m11c-c1/capture-r11.mjs
          node --check tools/m11c-c1/export.mjs
          git diff --exit-code origin/main -- data/m11b apps/campus/src/batch02-core.mjs apps/campus/src/batch03-core.mjs apps/campus/src/batch04-core.mjs apps/campus/src/batch05-core.mjs apps/campus/src/batch05-r12.mjs apps/campus/src/render
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/campus/src/player/motor.mjs data/m11c/c1/config.json tests/m11c/c1/controller.test.mjs tools/m11c-c1/export.mjs tools/m11c-c1/capture-r11.mjs docs/m11c/c1/design.md
          git commit -m 'fix(c1): correct camera-relative strafe and add directional slope speed [skip ci]'
          git push origin HEAD:codex/c1-player-controller
          node tools/m11c-c1/export.mjs
          viewer_sha=$(node -p "JSON.parse(require('fs').readFileSync('artifacts/m11c-c1/viewer-manifest.json')).sha256")
          git add artifacts/m11c-c1/Yali_C1_R1_1_Viewer.html artifacts/m11c-c1/viewer-manifest.json qa/m11c-c1/r1.1/build
          git commit -m 'build(c1): export R1.1 controller Viewer and 25 directed tests [skip ci]'
          git push origin HEAD:codex/c1-player-controller
          git ls-remote origin refs/heads/main refs/heads/codex/c1-player-controller | tee qa/m11c-c1/r1.1/build/remote-refs.txt
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/codex/c1-player-controller | cut -f1)"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "viewer_sha=$viewer_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: C1-R11-build
          path: |
            artifacts/m11c-c1/Yali_C1_R1_1_Viewer.html
            artifacts/m11c-c1/viewer-manifest.json
            qa/m11c-c1/r1.1/build
          retention-days: 30
  browser:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        group: [fix, input, terrain, mobile, fallback, review]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locked browser dependencies
        run: |
          npm ci --prefix apps/campus
          npm install --prefix "$RUNNER_TEMP/c1-browser" --save-exact playwright@1.62.0
          "$RUNNER_TEMP/c1-browser/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/c1-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Actual R1.1 Viewer controls and traversal
        env:
          C1_GROUP: ${{ matrix.group }}
          C1_PHASE: r1.1
        run: |
          set -o pipefail
          node tools/m11c-c1/capture-r11.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: C1-R11-${{ matrix.group }}
          path: qa/m11c-c1/r1.1/${{ matrix.group }}
          retention-days: 30
  publish:
    needs: [prepare, browser]
    if: ${{ always() && needs.prepare.result == 'success' && needs.browser.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/c1-player-controller
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: C1-R11-*
          path: incoming
          merge-multiple: true
      - name: Bind passed browser reports and document R1.1
        env:
          VIEWER_SHA: ${{ needs.prepare.outputs.viewer_sha }}
        run: |
          set -euo pipefail
          mkdir -p qa/m11c-c1/r1.1
          if [ -d incoming/qa/m11c-c1/r1.1 ]; then cp -a incoming/qa/m11c-c1/r1.1/. qa/m11c-c1/r1.1/; fi
          python - <<'PY'
          import json,pathlib,os
          root=pathlib.Path('.')
          groups=['fix','input','terrain','mobile','fallback','review']
          reports=[]
          for g in groups:
              p=root/'qa/m11c-c1/r1.1'/g/'report.json'
              d=json.loads(p.read_text())
              assert d['passed'] is True,(g,d.get('errors'))
              assert d['viewerSHA256']==os.environ['VIEWER_SHA'],(g,d['viewerSHA256'])
              reports.append(d)
          summary={'stage':'M1.1-C','batch':'C1','version':'R1.1','status':'IMPLEMENTED / REVIEW_PENDING','viewer':'artifacts/m11c-c1/Yali_C1_R1_1_Viewer.html','viewerSHA256':os.environ['VIEWER_SHA'],'groups':groups,'checks':sum(len(d['checks']) for d in reports),'screenshots':sum(len(d['screenshots']) for d in reports),'fixes':['A/D and touch horizontal input are camera-relative and no longer mirrored','Ground contact normal drives directional slope speed: uphill slower, cross-slope neutral, downhill mildly faster with 1.12 cap'],'acceptanceCreated':False}
          (root/'qa/m11c-c1/r1.1/summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          doc=f'''# C1 R1.1｜方向与坡速修复\n\n**IMPLEMENTED / REVIEW_PENDING**。用户指出 R1 的左右控制反向、不同坡度速度无差异；本修订直接修复这两项，不登记 acceptance，不进入 C2。\n\n- A/D 与触屏横向输入统一按当前相机屏幕左右解释；四个基准 yaw 有节点测试。\n- 实际接触坡面法线与当前移动方向共同计算坡向角：2°内保持平地速度；上坡连续减速，42°附近最低为平地 45%；下坡温和提速并封顶 112%；横切坡面基本不变。台阶仍交给 Rapier autostep，不将单级台阶错误计成持续坡。\n- B01—B05 已认可几何、共享材质/色板/日光/反射与 C1 人形美术不变。\n- 生产构建和 25 项定向测试通过；真实 Chromium 组 `{', '.join(groups)}` 全部通过，共 {summary['checks']} 项检查、{summary['screenshots']} 张截图，绑定 Viewer SHA256 `{summary['viewerSHA256']}`。\n\nViewer：`artifacts/m11c-c1/Yali_C1_R1_1_Viewer.html`。C1 R1 历史产物保留。\n'''
          (root/'docs/m11c/c1/r11-fix.md').write_text(doc)
          delivery=root/'docs/m11c/c1/delivery.md'
          text=delivery.read_text()
          note=f'> 当前修订：**C1 R1.1 / IMPLEMENTED / REVIEW_PENDING**。已修复相机相对左右控制与方向性坡面速度；详见 [R1.1 修复](r11-fix.md)。R1 Viewer/QA 保留为历史。\n\n'
          if not text.startswith('> 当前修订：**C1 R1.1'):
              delivery.write_text(note+text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/m11c-c1/r1.1 docs/m11c/c1/r11-fix.md docs/m11c/c1/delivery.md
          git commit -m 'qa(c1): publish R1.1 direction and slope-speed browser evidence [skip ci]'
          git push origin HEAD:codex/c1-player-controller
          git ls-remote origin refs/heads/codex/c1-player-controller
      - uses: actions/upload-artifact@v4
        with:
          name: C1-R11-review
          path: |
            artifacts/m11c-c1/Yali_C1_R1_1_Viewer.html
            docs/m11c/c1/r11-fix.md
            qa/m11c-c1/r1.1
          retention-days: 30
