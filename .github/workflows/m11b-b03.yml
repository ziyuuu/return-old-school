name: B03 library garden canteen delivery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m11b-b03.yml'
      - 'apps/campus/src/batch03*'
      - 'data/m11b/batch03/**'
      - 'tools/m11b-b03/**'
permissions:
  contents: write
concurrency:
  group: yali-b03-main
  cancel-in-progress: false
jobs:
  b03:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/campus/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normal build and focused geometry checks
        run: |
          set -euo pipefail
          mkdir -p qa/m11b-b03
          npm ci --prefix apps/campus
          npm run build --prefix apps/campus | tee qa/m11b-b03/build.txt
          node tools/m11b-b03/check.mjs
          node tools/m11b-b03/export.mjs
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install actual Chromium and CJK rendering
        run: |
          pip install playwright==1.62.0 pillow
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Real full-scene routes, doors, desktop and mobile screenshots
        run: python tools/m11b-b03/capture.py
      - name: Archive successful QA without marking alumni approval
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('qa/m11b-b03/browser-report.json').read_text())
          p=json.loads(Path('data/m11b/batch03/input.json').read_text())
          assert r['passed'] and r['complete'] and r['version']==p['version']
          f=Path('docs/m11b/batch03/delivery.md');s=f.read_text().split('\n## R2 实际检查归档')[0]
          s+='\n## R2 实际检查归档\n\n正常类型检查/Vite构建及'+str(len(r['checks']))+'组真实Chromium检查通过；'+str(len(r['access']['routes']))+'条路线、'+str(len(r['access']['doors']))+'处真门洞，'+str(len(r['screenshots']))+'张实际截图。390×844为viewport，不是物理手机。\n\n受测源码 `'+r['source_sha']+'`；Viewer SHA256 `'+r['viewer_sha256']+'`。B03仍IMPLEMENTED / REVIEW_PENDING，不代替校友认可。\n'
          f.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '4189828282+github-actions[bot]@users.noreply.github.com'
          git add qa/m11b-b03 docs/m11b/batch03/access.svg docs/m11b/batch03/delivery.md
          if ! git diff --cached --quiet; then
            git commit -m 'qa(b03): archive actual WebGL verification; alumni review pending [skip ci]'
            git push origin HEAD:main
          fi
      - name: Package exact tested Viewer, private photo Review and full Workspace
        run: python tools/m11b-b03/package.py
      - name: Retain current source and actual outputs even on failure
        if: always()
        run: |
          mkdir -p artifacts/m11b-b03
          git archive --format=tar.gz HEAD > artifacts/m11b-b03/current-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Yali-M1-1-B-B03-R2-Viewer-Review-Workspace
          path: |
            artifacts/m11b-b03/
            qa/m11b-b03/
          retention-days: 30
