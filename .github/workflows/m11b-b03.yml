name: B03 library garden canteen delivery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/m11b-b03.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch only existing locked dependencies and registered originals
        run: |
          set -euo pipefail
          npm ci --prefix apps/campus
          mkdir -p /tmp/b03-prepare/references
          tar -czf /tmp/b03-prepare/node_modules.tar.gz -C apps/campus node_modules
          git archive --format=tar.gz HEAD > /tmp/b03-prepare/source.tar.gz
          python - <<'PY'
          import urllib.request,json,hashlib,pathlib,time
          out=pathlib.Path('/tmp/b03-prepare/references')
          urls={
            'S03-049':'https://k.sinaimg.cn/n/sinacn/w600h450/20180312/fb06-fyscsmu8208695.jpg/w700d1q75cms.jpg',
            'S03-050':'https://k.sinaimg.cn/n/sinacn/w1080h378/20180312/efdc-fyscsmu8208782.jpg/w700d1q75cms.jpg',
            'S03-031':'https://k.sinaimg.cn/n/sinacn/w1080h721/20180312/07ba-fyscsmu8207486.jpg/w700d1q75cms.jpg',
            'S03-032':'https://k.sinaimg.cn/n/sinacn/w1000h667/20180312/fe2c-fyscsmu8207556.jpg/w700d1q75cms.jpg',
            'SOHU-LIBRARY':'https://img.mp.sohu.com/upload/20170806/350f283a43b749fd8e4b159b4826a46b_th.jpg',
            'SOHU-GARDEN':'https://img.mp.sohu.com/upload/20170806/1ccb301b3a1349d7b9fd8b8bbdd7f5d3_th.jpg'
          }
          rows=[]
          for id,url in urls.items():
            row={'id':id,'url':url,'rights':'Reference research only; not licensed for public repository or game textures.','capture_date':None}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://k.sina.com.cn/'})
              data=urllib.request.urlopen(req,timeout=45).read()
              if not data.startswith(b'\xff\xd8'): raise ValueError('Not JPEG')
              (out/(id+'.jpg')).write_bytes(data);row.update(bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
            except Exception as e: row['error']=str(e)
            rows.append(row)
          (out/'receipt.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B03-locked-runtime-research-input
          path: /tmp/b03-prepare
          retention-days: 7
