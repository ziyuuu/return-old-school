name: B03 library garden canteen delivery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m11b-b03.yml'
      - 'apps/campus/src/batch03*'
      - 'data/m11b/batch03/**'
      - 'tools/m11b-b03/**'
permissions:
  contents: write
concurrency:
  group: yali-b03-main
  cancel-in-progress: false
jobs:
  b03:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/campus/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply locally built source without reverting current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > /tmp/b03.patch
          for sha in 01e2b463ed0afad0a0d161bbfed055a6e25e952c 65d18564e43056b6f4f3d8028031b5f7b6b876ae b2ba5ce8ce2ca88aadbf4938c8d25f21386fb506 9d43e2f4285da9d04126baa57d56c5da087d7f9b; do
            gh api repos/ziyuuu/return-old-school/git/blobs/$sha --jq .content | base64 -d > /tmp/b03-$sha.gz
            test "$(git hash-object /tmp/b03-$sha.gz)" = "$sha"
            gzip -dc /tmp/b03-$sha.gz >> /tmp/b03.patch
          done
          if git apply --reverse --check /tmp/b03.patch 2>/dev/null; then
            echo 'Integrated source already present.'
          else
            git apply --check /tmp/b03.patch
            git apply /tmp/b03.patch
          fi
      - name: Normal typecheck/build and eight targeted geometry groups
        run: |
          set -euo pipefail
          mkdir -p qa/m11b-b03
          npm ci --prefix apps/campus
          npm run build --prefix apps/campus | tee qa/m11b-b03/build.txt
          node tools/m11b-b03/check.mjs
          node tools/m11b-b03/export.mjs
          git diff --exit-code 47c1316d4ff3920e8e939a88a20a175b8c54d7e3 -- data/m10 apps/campus/src/batch02-core.mjs apps/campus/src/batch02-scene.ts apps/campus/src/b01-shutter-fix.mjs data/m11b/batch02/input.json data/m11b/batch01-r2 data/m11b/batch01-r3
      - name: Commit integrated source before browser verification
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '4189828282+github-actions[bot]@users.noreply.github.com'
          git add apps/campus/src/main.ts apps/campus/src/batch03-core.mjs apps/campus/src/batch03-scene.ts apps/campus/index.html data/m11b/batch03 tools/m11b-b03 docs/m11b/batch03 README.md docs/development-plan.md .gitignore
          if ! git diff --cached --quiet; then
            git commit -m 'feat(b03): build library uphill garden curved stair and canteen lower shop in default campus (#32)'
            git push origin HEAD:main
          fi
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Set up actual Chromium and CJK rendering
        run: |
          pip install playwright==1.62.0 pillow
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Actual full-scene routes, entrances and desktop/mobile screenshots
        run: python tools/m11b-b03/capture.py
      - name: Archive actual successful QA
        run: |
          set -euo pipefail
          git add qa/m11b-b03 docs/m11b/batch03
          if ! git diff --cached --quiet; then
            git commit -m 'qa(b03): archive real Chromium screenshots and entrance clearance results (#32)'
            git push origin HEAD:main
          fi
          if test -f tools/m11b-b03/package.py; then python tools/m11b-b03/package.py; fi
      - name: Retain source and outputs even when inspection finds a problem
        if: always()
        run: |
          mkdir -p artifacts/m11b-b03
          git archive --format=tar.gz HEAD > artifacts/m11b-b03/current-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Yali-M1-1-B-B03-Viewer-Review-Workspace
          path: |
            artifacts/m11b-b03/
            qa/m11b-b03/
          retention-days: 30
