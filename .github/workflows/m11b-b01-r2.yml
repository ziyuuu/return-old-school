name: Build and verify B01 R2
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: yali-b01-r2-main
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate explicitly checked source and screenshot refinements once
        run: |
          python tools/m11b/r2/integrate.py
          python tools/m11b/r2/polish.py
          git diff --exit-code -- data/m10 data/m11a/patch03 data/m11a/patch04
      - name: Run every inherited and new regression and production build
        run: |
          set -o pipefail
          mkdir -p qa/m11b-b01-r2
          npm ci --prefix apps/campus
          node --test tests/m10/*.test.mjs tests/m11a/*.test.mjs tests/m11a/patch02/*.test.mjs tests/m11b/*.test.mjs tests/m11b/r2/*.test.mjs | tee qa/m11b-b01-r2/unit-tests.txt
          npm run build --prefix apps/campus | tee qa/m11b-b01-r2/build.txt
          node tools/m11b/r2/export.mjs
          git diff --exit-code -- data/m10 data/m11a/patch03 data/m11a/patch04
      - name: Commit readable integration, screenshot fixes and derived R2-only data
        run: |
          git config user.name 'return-old-school validation bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/campus/src apps/campus/index.html data/m11b/batch01-r2 tools/m11b/r2 docs/development-plan.md
          git diff --cached --quiet || git commit -m 'fix: retain screenshot-reviewed R2 corridor glazing, guarded end walls and camera framing'
          git push origin HEAD:main
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git rev-parse HEAD > qa/m11b-b01-r2/source-commit.txt
      - name: Install real Chromium and CJK display support
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          sudo apt-get -o Acquire::Retries=3 install -y fonts-noto-cjk
      - name: Actual WebGL portals, supports, section and desktop/mobile screenshots
        run: python tools/m11b/r2/capture.py
      - name: Package actual screenshot Review, diagrams and complete Workspace
        if: always()
        run: |
          if test -f qa/m11b-b01-r2/browser-report.json; then python tools/m11b/r2/package.py; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Yali-M1.1-B-B01-R2
          path: |
            artifacts/m11b-b01-r2/
            qa/m11b-b01-r2/
          retention-days: 60
          if-no-files-found: error
      - name: Archive verified QA and delivery without auto-approving alumni review
        if: success()
        run: |
          git add docs/m11b/batch01-r2 data/m11b/batch01-r2
          git add -f qa/m11b-b01-r2
          git diff --cached --quiet || git commit -m 'test: archive actual B01 R2 WebGL geometry, desktop/mobile screenshots and delivery hashes'
          git push origin HEAD:main
