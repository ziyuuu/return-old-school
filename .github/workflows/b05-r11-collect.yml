name: B05 R1.1 inspection archive
on:
  push:
    branches: [codex/b05-development]
    paths: [.github/workflows/b05-r11-collect.yml]
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - name: Wait for the exact final R1.1 run, preserving failed results too
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/b05-r11-evidence
          for i in $(seq 1 150); do
            status=$(gh api repos/ziyuuu/return-old-school/actions/runs/34755586253 --jq .status)
            echo "Exact run 34755586253: $status"
            [ "$status" = completed ] && break
            sleep 15
          done
          gh api repos/ziyuuu/return-old-school/actions/runs/34755586253 > /tmp/b05-r11-evidence/run.json
          gh api repos/ziyuuu/return-old-school/actions/runs/34755586253/jobs > /tmp/b05-r11-evidence/jobs.json
          gh api repos/ziyuuu/return-old-school/actions/runs/34755586253/artifacts > /tmp/b05-r11-evidence/artifacts.json
          gh run download 34755586253 --repo ziyuuu/return-old-school --pattern 'B05-R11-*' --dir /tmp/b05-r11-evidence/artifacts
          python - <<'PY'
          import pathlib,json
          for p in sorted(pathlib.Path('/tmp/b05-r11-evidence/artifacts').rglob('report.json')):
              d=json.loads(p.read_text());print(str(p),d.get('passed'),len(d.get('views',[])),len(d.get('samples',[])),d.get('viewerSHA256'),d.get('errors'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B05-R11-inspection-evidence
          path: /tmp/b05-r11-evidence
          retention-days: 7
