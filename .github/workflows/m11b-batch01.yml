name: Build and verify M1.1-B Batch01
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/b01-seed/**'
      - '.github/workflows/m11b-batch01.yml'
      - 'apps/campus/**'
      - 'data/m11b/**'
      - 'data/m11a/patch03/**'
      - 'data/m11a/patch04/**'
      - 'tests/m11b/**'
      - 'tools/m11b/**'
permissions:
  contents: write
concurrency:
  group: m11b-batch01-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize auditable source without changing frozen M1.0
        run: python .github/b01-seed/materialize.py
      - name: Build and run all inherited and Batch01 regressions
        run: |
          set -o pipefail
          mkdir -p qa/m11b-b01
          cd apps/campus
          npm ci
          cd ../..
          node --test tests/m10/*.test.mjs tests/m11a/*.test.mjs tests/m11a/patch02/*.test.mjs tests/m11b/*.test.mjs | tee qa/m11b-b01/unit-tests.txt
          cd apps/campus
          npm run build | tee ../../qa/m11b-b01/build.txt
          cd ../..
          node tools/m11b/export.mjs
      - name: Synchronize readable implementation; browser gate remains open
        run: |
          git config user.name 'return-old-school validation bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/development-plan.md apps/campus/src apps/campus/index.html data/m11a/patch03 data/m11a/patch04 data/m11b docs/m11a/patch04 docs/m11b tests/m11b tools/m11b .github/b01-seed/applied.sha
          git diff --cached --quiet || git commit -m 'feat: restore old main building and continuous toilet bridges on approved terrain; browser review pending'
          git push origin HEAD:main
          git rev-parse HEAD > qa/m11b-b01/source-commit.txt
      - name: Install actual Chromium and Chinese glyph support
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          sudo apt-get -o Acquire::Retries=3 install -y fonts-noto-cjk
      - name: Verify actual WebGL meshes, openings, supports, cameras and mobile viewport
        run: python tools/m11b/capture.py
      - name: Package actual screenshot review and complete workspace
        if: always()
        run: |
          if test -f qa/m11b-b01/browser-report.json; then
            python tools/m11b/package.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Yali-M1.1-B-Batch01
          path: |
            artifacts/m11b-b01/
            qa/m11b-b01/
          retention-days: 60
          if-no-files-found: error
      - name: Commit verified browser evidence without changing alumni review status
        if: success()
        run: |
          git add qa/m11b-b01
          git diff --cached --quiet || git commit -m 'test: record actual Chromium Batch01 mesh checks and desktop/mobile screenshots'
          git push origin HEAD:main
