name: B05 actual offline model review
on:
  push:
    branches: [codex/b05-development]
    paths: [.github/workflows/b05-review.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      revision: ${{ steps.build.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/b05-development
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: build
        name: Verify inspected display correction and normally push exact source
        run: |
          set -euo pipefail
          git fetch origin
          git merge-base --is-ancestor 9e28225532718e3d60cc518aaac36ccc65f3fc2c HEAD
          git merge-base --is-ancestor origin/main HEAD
          test -z "$(git status --short)"
          test -f apps/campus/src/batch05-core.mjs
          if ! grep -q 'const showGuides=' apps/campus/src/main.ts; then
            sed 's/^ diff --git /diff --git /' .github/b05-display-fix.patch > "$RUNNER_TEMP/b05-display-fix.patch"
            echo "9f416ac94747a18d52642f0f946ecea804d44de03607839c433e230d78b044be  $RUNNER_TEMP/b05-display-fix.patch" | sha256sum -c -
            git apply --check "$RUNNER_TEMP/b05-display-fix.patch"
            git apply "$RUNNER_TEMP/b05-display-fix.patch"
          fi
          if [ ! -f tools/m11b-b05/finalize.mjs ]; then
            python - <<'PY'
          import pathlib,base64,lzma,hashlib,subprocess
          patch=lzma.decompress(base64.b64decode(''.join(f.read_text().strip() for f in sorted(pathlib.Path('.github/b05-delivery').glob('*.txt')))))
          assert hashlib.sha256(patch).hexdigest()=='a322495cef5fdba4900e8c46d309909331dfec42880e0c81a727bdd162c9fd78'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          PY
          fi
          npm ci --prefix apps/campus
          mkdir -p qa/m11b-b05/final/build
          git diff --check
          npm run build --prefix apps/campus 2>&1 | tee qa/m11b-b05/final/build/build.log
          node --test tests/m11b/b05/model.test.mjs tests/render-upgrade/*.test.mjs 2>&1 | tee qa/m11b-b05/final/build/tests.tap
          node --check tools/m11b-b05/finalize.mjs
          git diff --exit-code 9e28225532718e3d60cc518aaac36ccc65f3fc2c -- apps/campus/src/batch02-core.mjs apps/campus/src/batch03-core.mjs apps/campus/src/batch04-core.mjs data/m11b/batch01/acceptance.json data/m11b/batch02/acceptance.json data/m11b/batch03/acceptance.json data/m11b/batch04/acceptance.json
          test ! -f data/m11b/batch05/acceptance.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/campus/src/main.ts apps/campus/src/batch05-scene.ts tools/m11b-b05 data/m11b/batch05 docs/m11b/batch05/evidence.md
          if ! git diff --cached --quiet; then
            git diff --cached --stat
            git commit -m 'fix(b05): correct inscription aspect and keep survey guides opt-in; document H boundaries [skip ci]'
            git push origin HEAD:codex/b05-development
          fi
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/codex/b05-development | cut -f1)"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          node tools/m11b-b05/export.mjs
          git bundle create /tmp/b05-source.bundle HEAD ^9e28225532718e3d60cc518aaac36ccc65f3fc2c
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B05-build-source
          path: |
            qa/m11b-b05/final/build
            artifacts/m11b-b05
            /tmp/b05-source.bundle
          retention-days: 7
  browser:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        group: [gate, courts, field, residential, checks, regression, mobile, fallback, performance, baseline]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locked source and browser dependencies
        run: |
          npm ci --prefix apps/campus
          npm install --prefix "$RUNNER_TEMP/b05-browser" playwright@1.62.0
          "$RUNNER_TEMP/b05-browser/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/b05-browser/node_modules/playwright" >> "$GITHUB_ENV"
          node tools/m11b-b05/export.mjs
      - name: Exact Viewer real WebGL screenshots and diagnostics
        env:
          B05_GROUP: ${{ matrix.group }}
          B05_PHASE: final
        run: |
          set -o pipefail
          mkdir -p qa/m11b-b05/final/${{ matrix.group }}
          node tools/m11b-b05/capture.mjs 2>&1 | tee qa/m11b-b05/final/${{ matrix.group }}/capture.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B05-final-${{ matrix.group }}
          path: |
            qa/m11b-b05/final/${{ matrix.group }}
            artifacts/m11b-b05
          retention-days: 7
