name: C2 grounded locomotion animation fix
on:
  push:
    branches: [codex/c2-student-avatar]
    paths: [.github/workflows/c2-animation-fix.yml]
permissions:
  contents: write
jobs:
  fix-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: codex/c2-student-avatar, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Fix animation drive, build, test and export
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/campus/src/player/player-mode.ts');s=p.read_text()
          old="let joy={x:0,z:0},lastNotice='',lastNoticeAt=0,lastFrame:any=null,physicsMs=0,frameSamples:number[]=[],tickSamples:number[]=[];"
          new="let joy={x:0,z:0},lastNotice='',lastNoticeAt=0,lastFrame:any=null,physicsMs=0,avatarMotionSpeed=0,frameSamples:number[]=[],tickSamples:number[]=[];"
          assert old in s;s=s.replace(old,new)
          old="avatar.update(motor.feet(),motor.heading,motor.actualSpeed,motor.travel,motor.grounded,lastFrame.hideAvatar,Math.min(dt,.1));"
          new="avatarMotionSpeed=motor.blocked?motor.actualSpeed:Math.hypot(motor.velocity.x,motor.velocity.z);\n    avatar.update(motor.feet(),motor.heading,avatarMotionSpeed,motor.travel,motor.grounded,lastFrame.hideAvatar,Math.min(dt,.1));"
          assert old in s;s=s.replace(old,new)
          old="avatar:{visible:avatar.root.visible,footPosition:avatar.root.position.toArray(),...avatar.state()},physicsMs"
          new="avatar:{visible:avatar.root.visible,footPosition:avatar.root.position.toArray(),animationDriveSpeed:avatarMotionSpeed,...avatar.state()},physicsMs"
          assert old in s;s=s.replace(old,new)
          p.write_text(s)
          c=Path('tools/m11c-c2/capture.mjs');t=c.read_text()
          start="await page.evaluate(()=>{window.__YALI_C1__.spawn('gate');return window.__YALI_C1__.drive({x:0,z:1,run:false},36)});st=await page.evaluate(()=>window.__YALI_C1__.state());check('walk animation reached during actual movement',st.avatar.animation==='walk'&&st.motor.actualSpeed>.12,{avatar:st.avatar,speed:st.motor.actualSpeed,feet:st.motor.feet});methods['02-walk']=await canvasShot(page,'02-walk');\nawait page.evaluate(()=>{window.__YALI_C1__.spawn('gate');return window.__YALI_C1__.drive({x:0,z:1,run:true},36)});st=await page.evaluate(()=>window.__YALI_C1__.state());check('run animation reached during actual movement',st.avatar.animation==='run'&&st.motor.actualSpeed>2.35,{avatar:st.avatar,speed:st.motor.actualSpeed,feet:st.motor.feet});methods['03-run']=await canvasShot(page,'03-run');await ctx.close();"
          repl="const walk=await page.evaluate(()=>{window.__YALI_C1__.spawn('gate');const a=window.__YALI_C1__.state().motor.feet;const r=window.__YALI_C1__.drive({x:0,z:1,run:false},36);const b=r.end.motor.feet;return {state:r.end,averageSpeed:Math.hypot(b[0]-a[0],b[2]-a[2])/(36/60)}});st=walk.state;check('walk animation follows sustained movement',st.avatar.animation==='walk'&&walk.averageSpeed>1&&st.avatar.animationDriveSpeed>.12,{avatar:st.avatar,averageSpeed:walk.averageSpeed,instantActualSpeed:st.motor.actualSpeed,feet:st.motor.feet});methods['02-walk']=await canvasShot(page,'02-walk');\nconst run=await page.evaluate(()=>{window.__YALI_C1__.spawn('gate');const a=window.__YALI_C1__.state().motor.feet;const r=window.__YALI_C1__.drive({x:0,z:1,run:true},36);const b=r.end.motor.feet;return {state:r.end,averageSpeed:Math.hypot(b[0]-a[0],b[2]-a[2])/(36/60)}});st=run.state;check('run animation follows sustained movement',st.avatar.animation==='run'&&run.averageSpeed>2.35&&st.avatar.animationDriveSpeed>2.35,{avatar:st.avatar,averageSpeed:run.averageSpeed,instantActualSpeed:st.motor.actualSpeed,feet:st.motor.feet});methods['03-run']=await canvasShot(page,'03-run');await ctx.close();"
          assert start in t;t=t.replace(start,repl);c.write_text(t)
          PY
          npm ci --prefix apps/campus
          npm run build --prefix apps/campus
          node --test tests/m11c/c1/*.test.mjs tests/m11c/c2/*.test.mjs tests/render-upgrade/*.test.mjs | tee /tmp/c2-tests.tap
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/campus/src/player/player-mode.ts tools/m11c-c2/capture.mjs
          git commit -m 'fix(c2): drive locomotion animation from stable horizontal motion speed [skip ci]'
          git push origin HEAD:codex/c2-student-avatar
          node tools/m11c-c2/export.mjs
          mkdir -p qa/m11c-c2/build
          cp /tmp/c2-tests.tap qa/m11c-c2/build/tests.tap
          git add artifacts/m11c-c2 qa/m11c-c2/build
          git commit -m 'build(c2): re-export R1 Viewer after animation-drive fix [skip ci]'
          git push origin HEAD:codex/c2-student-avatar
      - name: Install Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/c2-browser" --save-exact playwright@1.62.0
          "$RUNNER_TEMP/c2-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/c2-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Exact Viewer browser QA and delivery
        run: |
          set -euo pipefail
          node tools/m11c-c2/capture.mjs
          python - <<'PY'
          import json,pathlib
          r=pathlib.Path('.');q=json.loads((r/'qa/m11c-c2/browser/report.json').read_text());m=json.loads((r/'artifacts/m11c-c2/viewer-manifest.json').read_text());assert q['passed'] and q['viewerSHA256']==m['sha256'];assert len(q['screenshots'])==4
          (r/'docs/m11c/c2/delivery.md').write_text(f'''# C2 R1｜学生形象与基础动画交付\n\n**IMPLEMENTED / REVIEW_PENDING**。继承C1 R1.2手机优化和全部已认可校园模型；不登记acceptance、不合并main。\n\nViewer：`artifacts/m11c-c2/Yali_C2_R1_Viewer.html`，SHA256 `{m['sha256']}`。\n\n实现：证据有界的偏大尺码秋季校服学生工作重建；idle / walk / run / air 四态。未阻挡时动画使用稳定的水平运动速度，真实阻挡时回落到实际位移速度，避免Rapier接地tick抖动造成走路瞬时回idle。第三/第一人称、坡速、碰撞、相机与手机流畅档沿用C1 R1.2。无校徽、班级、个人脸或外部人物纹理。\n\n节点测试34/34；实际Chromium {len(q['checks'])}项检查、{len(q['screenshots'])}张实际WebGL截图通过。桌面视觉QA使用720×480可逆流畅档、手机390×844流畅档，均为完整校园几何；精确剪裁、色值、发型和体型仍为H；C3尚未开始。\n''')
          (r/'qa/m11c-c2/README.md').write_text(f'''# C2 R1 QA\n\nViewer SHA256 `{m['sha256']}`。节点测试34/34；实际 Chromium 报告见 `browser/report.json`。四张画面均来自受测Viewer的同帧WebGL画布读取；桌面QA为720×480流畅档，手机为390×844流畅档，不减校园三角面。walk/run用36个固定物理tick的实际位移均速和动画驱动速度共同验证。\n''')
          PY
          git add docs/m11c/c2 qa/m11c-c2
          git commit -m 'qa(c2): deliver inspected student avatar and locomotion animation [skip ci]'
          git push origin HEAD:codex/c2-student-avatar
          git ls-remote origin refs/heads/codex/c2-student-avatar refs/heads/codex/c1-player-controller refs/heads/main | tee qa/m11c-c2/remote-refs.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: C2-R1-final-review
          path: |
            artifacts/m11c-c2
            qa/m11c-c2
            docs/m11c/c2
          retention-days: 30
