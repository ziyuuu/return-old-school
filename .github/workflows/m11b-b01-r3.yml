name: Verify current B01 side-wall shutter repair
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m11b-b01-r3.yml'
      - 'apps/campus/**'
      - 'data/m11b/batch01-r3/shutter-fix.json'
      - 'tools/m11b/shutter-fix/**'
      - 'tests/m11b/r3/shutter-fix.test.mjs'
permissions:
  contents: write
concurrency:
  group: yali-b01-r3-main
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wire the reviewed small repair and run focused checks
        run: |
          set -o pipefail
          python tools/m11b/shutter-fix/integrate.py
          mkdir -p qa/m11b-shutter-fix
          npm ci --prefix apps/campus
          node --test tests/m11b/r3/shutter-fix.test.mjs | tee qa/m11b-shutter-fix/tests.txt
          npm run build --prefix apps/campus | tee qa/m11b-shutter-fix/build.txt
          node tools/m11b/shutter-fix/export.mjs
          git config user.name 'return-old-school validation bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/campus/src/main.ts apps/campus/index.html README.md docs/development-plan.md
          git diff --cached --quiet || git commit -m 'fix: activate open side-wall shutter entrances and enlarged supported canopies'
          git push origin HEAD:main
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install browser and run focused actual geometry and screenshots
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          sudo apt-get -o Acquire::Retries=3 install -y fonts-noto-cjk
          python tools/m11b/shutter-fix/capture.py
          python tools/m11b/shutter-fix/package.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Yali-B01-R3.1-Shutter-Fix
          path: |
            artifacts/m11b-shutter-fix/
            qa/m11b-shutter-fix/
          retention-days: 30
      - name: Archive actual QA; alumni review stays pending
        if: success()
        run: |
          git add docs/m11b/shutter-fix
          git add -f qa/m11b-shutter-fix
          git diff --cached --quiet || git commit -m 'test: archive focused shutter repair screenshots, route probes and delivery hash'
          git push origin HEAD:main
