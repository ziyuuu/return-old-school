name: Build and verify B01 R3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m11b-b01-r3.yml'
      - 'apps/campus/**'
      - 'data/m11b/batch01-r3/**'
      - 'tests/m11b/r3/**'
      - 'tools/m11b/r3/**'
permissions:
  contents: write
concurrency:
  group: yali-b01-r3-main
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate R3 and screenshot-observed corrections
        run: |
          python tools/m11b/r3/integrate.py
          python tools/m11b/r3/refine.py
          python tools/m11b/r3/foundation.py
          git diff --exit-code -- data/m10 data/m11a/patch03 data/m11a/patch04 data/m11b/batch01-r2
      - name: All inherited and R3 fault regressions plus production build
        run: |
          set -o pipefail
          mkdir -p qa/m11b-b01-r3
          npm ci --prefix apps/campus
          node --test tests/m10/*.test.mjs tests/m11a/*.test.mjs tests/m11a/patch02/*.test.mjs tests/m11b/*.test.mjs tests/m11b/r2/*.test.mjs tests/m11b/r3/*.test.mjs | tee qa/m11b-b01-r3/unit-tests.txt
          npm run build --prefix apps/campus | tee qa/m11b-b01-r3/build.txt
          node tools/m11b/r3/export.mjs
          git diff --exit-code -- data/m10 data/m11a/patch03 data/m11a/patch04 data/m11b/batch01-r2
      - name: Commit readable integrated corrections before actual browser verification
        run: |
          git config user.name 'return-old-school validation bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/campus/src apps/campus/index.html tools/m11b/r3 tests/m11b/r3 docs/development-plan.md docs/m11b/batch01-r3 data/m11b/batch01-r3
          git diff --cached --quiet || git commit -m 'fix: support exposed entrance wall bases with exact notched-footprint foundations'
          git push origin HEAD:main
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git rev-parse HEAD > qa/m11b-b01-r3/source-commit.txt
      - name: Install actual Chromium and Chinese rendering support
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          sudo apt-get -o Acquire::Retries=3 install -y fonts-noto-cjk
      - name: Real WebGL front entrances, arc, bridges and desktop/mobile screenshots
        run: python tools/m11b/r3/capture.py
      - name: Package actual screenshots and reproducible workspace
        if: always()
        run: |
          if test -f qa/m11b-b01-r3/browser-report.json; then python tools/m11b/r3/package.py; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Yali-M1.1-B-B01-R3
          path: |
            artifacts/m11b-b01-r3/
            qa/m11b-b01-r3/
          retention-days: 60
          if-no-files-found: error
      - name: Archive passed actual QA without approving alumni review
        if: success()
        run: |
          git add docs/m11b/batch01-r3 data/m11b/batch01-r3
          git add -f qa/m11b-b01-r3
          git diff --cached --quiet || git commit -m 'test: archive final supported R3 geometry, actual screenshots and delivery hashes'
          git push origin HEAD:main
