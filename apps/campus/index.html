<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#edf0e8"><title>复原雅礼 · M1.0 R4 空间骨架</title></head>
<body>
<div id="app">
  <div id="viewport" aria-label="雅礼校园空间校核视窗"></div>
  <header class="masthead"><div class="seal">雅</div><div><div class="eyebrow">RETURN OLD SCHOOL <span>/ M1.0 R4</span></div><h1>复原雅礼<span>空间骨架</span></h1><p>东塘校区 · 2006—2010 记忆基底</p></div></header>
  <div class="top-tools"><button id="inspect-btn" aria-expanded="false" aria-controls="inspector">设施与证据 <span>↗</span></button><button id="capture-btn" title="保存当前真实WebGL画面">保存视图</button></div>
  <div class="mode-chip" id="view-name">全校鸟瞰 <span>体量校核 / 非精模</span></div>
  <aside id="inspector" hidden>
    <div class="panel-heading"><h2>校核工作台</h2><button id="close-inspector" aria-label="关闭校核面板">×</button></div>
    <label for="toilet-level">厕所逐层剖看（隐藏上方楼层）</label><select id="toilet-level"><option value="0">完整楼体</option><option value="1">第1层</option><option value="2">第2层</option><option value="3">第3层</option><option value="4">第4层</option></select><label for="facility">设施索引 <small>28 项 / 不是 28 栋建筑</small></label><select id="facility"></select>
    <div id="details"></div>
    <div class="toggles"><label><input type="checkbox" id="roofs-check" checked> 风雨跑道顶棚</label><label><input type="checkbox" id="labels-check" checked> 关键设施标签</label><label><input type="checkbox" id="grid-check"> 10 m 工作网格</label><label><input type="checkbox" id="routes-check"> 路线连通检查</label><label><input type="checkbox" id="footprints-check"> 仅看占地轮廓</label></div>
    <button id="download-layout" class="wide">导出当前基线 JSON</button><details><summary id="check-summary">空间约束检查</summary><div id="checks"></div></details>
    <p class="fine">A 校友确认 · P 实拍 · R 类比 · H 推定 · U 未知。位置与尺寸分别记录。所有米制坐标均为 H 工作方案，并非测量结果。</p>
  </aside>
  <nav class="views" aria-label="校核机位"><button data-view="toilet-floor">厕所逐层</button><button data-view="toilet-front">厕所前廊</button><button data-view="black-routes">黑线支路</button><button data-view="rostrum">主席台</button><button data-view="overview" class="active">全校</button><button data-view="top">总平面</button><button data-view="sports">运动区</button><button data-view="teaching">主楼 / 连廊</button><button data-view="gym">体育馆</button><button data-view="gate">校门原点</button><button data-view="courts-to-gym">球场看馆</button><button data-view="canopy">棚下</button><button data-view="rear-field">后缘跑道</button><button data-view="library-route">图书馆通路</button><button data-view="underpass">两楼间穿行</button><button data-view="side-path">侧门小路</button><button data-view="entrances">校门/侧门</button><button data-view="longya">长雅正门</button><button data-view="family-canteen">家属区/食堂</button><button data-view="gym-contact">两楼贴体</button></nav>
  <div class="legend"><i></i><span>关系已确认 · 米制位置推定</span><b>H</b><span>未实测</span></div>
  <div id="toast" role="status"></div>
  <footer><div><strong>27</strong> 定位对象 <em>/</em> <strong>1</strong> 待定位 <em>·</em> <span>1 unit = 1 m 工作单位</span></div><p id="help">拖动环绕 · 右键平移 · 滚轮缩放 · 点击体块查证</p><button id="tour-btn">路线巡览</button><button id="fly-btn">自由校核</button></footer>
  <div id="error" hidden role="alert"></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body></html>
